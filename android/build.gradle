plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.argon2'
version = '0.1.0'

android {
  namespace "expo.modules.argon2"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Kotlin wrapper over the reference C Argon2, with prebuilt native binaries.
  // Pinned to an exact version on purpose: 1.6.0 is the first release whose
  // prebuilt .so are 16 KB-page aligned (required for Android 15 / 64-bit
  // devices and Google Play). Do NOT downgrade below 1.6.0. The Android CI job
  // verifies 16 KB alignment so a regression fails the build.
  implementation 'com.lambdapioneer.argon2kt:argon2kt:1.6.0'
}
